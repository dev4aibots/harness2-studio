[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness2-studio"
version = "1.1.0"
description = "Material 3 desktop control room for Google Research Harness2"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Harness2 Studio contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
harness2-studio = "h2studio.app:main"

[tool.setuptools]
packages = ["h2studio", "h2studio.services", "h2studio.views"]

[tool.setuptools.package-data]
h2studio = ["assets/*.png", "assets/*.svg"]

[tool.pytest.ini_options]
norecursedirs = ["bench/tasks", "bench/work", "bench/harness_versions", ".git"]
