name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: unit · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip ruff pytest
      - run: ruff check .
      - run: python -m pytest -q --ignore=tests/test_gui_smoke.py

  gui:
    name: gui · xvfb · py3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y xvfb tk
      - run: python -m pip install --upgrade pip ruff pytest
      - run: ruff check .
      - run: xvfb-run -a python -m pytest tests/test_gui_smoke.py -q
      - run: xvfb-run -a python tools/smoke.py
      - run: xvfb-run -a python tools/button_audit.py
